{% extends "base.html" %}

{% block content %}
<div style="max-width:800px; margin:30px auto;">
    <div style="background:#fff; border:1px solid #ddd; border-radius:10px; padding:24px;">
        <h1 style="margin-top:0;">{{ page_title }}</h1>

        <form method="POST">
            {% csrf_token %}

            <div style="margin-bottom:16px;">
                <label><strong>Title</strong></label><br>
                {{ form.title }}
                {% if form.title.errors %}
                    <div style="color:red;">{{ form.title.errors }}</div>
                {% endif %}
            </div>

            <div style="margin-bottom:16px;">
                <label><strong>Content</strong></label><br>
                {{ form.content }}
                {% if form.content.errors %}
                    <div style="color:red;">{{ form.content.errors }}</div>
                {% endif %}
            </div>

            <button type="submit"
                    style="background:#2563eb; color:white; border:none; padding:10px 16px; border-radius:8px; cursor:pointer;">
                Save
            </button>

            <a href="{% url 'announcement_list' %}" style="margin-left:10px;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
