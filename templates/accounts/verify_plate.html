<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify License Plate - CommunitySync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="antialiased text-slate-800 flex items-center justify-center min-h-screen px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        <div class="text-center mb-8">
            <div class="mx-auto w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mb-4">
                <i data-feather="truck"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Verify Identity</h1>
            <p class="text-slate-500 mt-2 text-sm">Please enter the license plate registered to your account.</p>
        </div>

        {% if messages %}
        <div class="mb-4 space-y-2">
            {% for message in messages %}
            <div class="p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm flex items-center gap-2">
                <i data-feather="alert-circle" class="w-4 h-4"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">License Plate</label>
                <input type="text" name="plate" placeholder="e.g. AB 1234" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 uppercase">
            </div>

            <button type="submit" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors">
                Verify Plate
            </button>
            
            <div class="text-center mt-4">
                <a href="{% url 'login' %}" class="text-sm font-medium text-slate-500 hover:text-slate-700">Back to Login</a>
            </div>
        </form>
    </div>
    
    <script>feather.replace();</script>
</body>
</html>
