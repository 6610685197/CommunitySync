{% extends "base.html" %}

{% block content %}
<div style="max-width:950px;margin:30px auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h1 style="margin:0;">Fee Types</h1>
        <a href="{% url 'fee_type_create' %}" style="background:#16a34a;color:white;text-decoration:none;padding:10px 14px;border-radius:8px;">+ Create Fee Type</a>
    </div>

    {% for item in fee_types %}
        <div style="background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin-bottom:16px;">
            <h3 style="margin:0 0 8px 0;">{{ item.name }}</h3>
            <p style="color:#666;">{{ item.description|default:"-" }}</p>
            <p>Status: {% if item.is_active %}Active{% else %}Inactive{% endif %}</p>
        </div>
    {% empty %}
        <p>No fee types yet.</p>
    {% endfor %}
</div>
{% endblock %}
