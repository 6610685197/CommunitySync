<!DOCTYPE html>
<html>
<head>
    <title>User List</title>
</head>
<body>

<h2>All Users</h2>

<table border="1" style="width:100%; text-align:center;">
    <tr>
        <th>Username</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Phone</th>
        <th>Car Plate</th>
        <th>Address</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>{{ user.phone_number }}</td>
        <td>{{ user.car_plate_num }}</td>
        <td>{{ user.address }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="7">No users found</td>
    </tr>
    {% endfor %}

</table>

<br>

<a href="{% url 'admin_dashboard' %}">Back to Dashboard</a>

</body>
</html>
