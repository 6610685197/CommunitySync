<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>CommunitySync Login</title>
  </head>
  <body>
    <div style="text-align: center; margin-top: 50px;">
      <h2>CommunitySync Login</h2>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
      </form>
      {% if error %}
        <p style="color: red;">{{ error }}</p>
      {% endif %}
    </div>
  </body>
</html>
