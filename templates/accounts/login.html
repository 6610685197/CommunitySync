<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CommunitySync Login</title>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div style="text-align: center; margin-top: 50px">
      <h2>CommunitySync Login</h2>

      <!-- Django Login -->
      <form method="post">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit">Login</button>
      </form>

      {% if error %}
      <p style="color: red">{{ error }}</p>
      {% endif %}

      <hr />

      <!-- OAuth Login -->
      <button onclick="loginWithDiscord()">Login with Discord</button>
      <br />
      <br />
      <button onclick="loginWithGoogle()">Login with Google</button>
    </div>

    <script>
      const SUPABASE_URL = "https://rjxislnrsgmxfyvqwgfh.supabase.co";
      const SUPABASE_KEY = "sb_publishable_o6Na_xY_hTMB7Ald1lTw2w_d52XQw7S";

      const { createClient } = supabase;

      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
          detectSessionInUrl: true,
          persistSession: true,
        },
      });

      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(";").shift();
      }

      async function loginWithDiscord() {
        await supabaseClient.auth.signInWithOAuth({
          provider: "discord",
          options: {
            redirectTo: window.location.origin + "/login/",
          },
        });
      }

      async function loginWithGoogle() {
        await supabaseClient.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: window.location.origin + "/login/",
          },
        });
      }

      async function checkSession() {
  console.log("Checking session...");

  await new Promise((resolve) => setTimeout(resolve, 500));

  const { data, error } = await supabaseClient.auth.getSession();

  console.log("Session response:", data, error);

  if (!data || !data.session) {
    console.log("No session detected");
    return;
  }

  const session = data.session;
  console.log("Session found:", session);

  const resp = await fetch("/auth/oauth/", {
    method: "POST",
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": getCookie("csrftoken"),
    },
    body: JSON.stringify({
      access_token: session.access_token,
      provider: session.user.app_metadata.provider,
    }),
  });

  const result = await resp.json();
  console.log("Backend result:", resp.status, result);

  if (resp.ok) {
    window.history.replaceState({}, document.title, "/login/");

    if (result.role === "juristic") {
      window.location.href = "/dashboard/";
    } else {
      window.location.href = "/home/";
    }
  }
}


      document.addEventListener("DOMContentLoaded", checkSession);
    </script>
  </body>
</html>
