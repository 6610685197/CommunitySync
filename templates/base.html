<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}CommunitySync{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .quick-actions button {
            margin: 4px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        ul li {
            margin: 6px 0;
        }
    </style>
</head>

<body>

    <!-- Top Navigation -->
    <div class="navbar">
        <h2>CommunitySync</h2>

        {% if request.user.is_authenticated %}
            <div>
                Welcome, <strong>{{ request.user.name }}</strong>
                <button onclick="logoutUser()">Logout</button>
            </div>
        {% endif %}
    </div>

    <!-- Page Content -->
    {% block content %}
    {% endblock %}

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://rjxislnrsgmxfyvqwgfh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_o6Na_xY_hTMB7Ald1lTw2w_d52XQw7S";

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        async function logoutUser() {
            await supabaseClient.auth.signOut();
            window.location.href = "{% url 'logout' %}";
        }
    </script>

</body>
</html>
