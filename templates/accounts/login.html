<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CommunitySync - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="antialiased text-slate-800 flex items-center justify-center min-h-screen bg-slate-50 px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">CommunitySync</h1>
            <p class="text-slate-500 mt-2 text-sm">Sign in to your account</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm flex items-center gap-2">
            <i data-feather="alert-circle" class="w-4 h-4"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}
        
        {% if messages %}
        <div class="mb-4 space-y-2">
            {% for message in messages %}
            <div class="p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm flex items-center gap-2">
                <i data-feather="check-circle" class="w-4 h-4"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                {{ form.username }}
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                {{ form.password }}
            </div>
            
            <div class="flex items-center justify-between mt-2">
                <a href="{% url 'forgot_password' %}" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
                    Forgot your password?
                </a>
            </div>

            <button type="submit" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                Sign In
            </button>
        </form>

        <div class="relative mt-8 mb-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-200"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-white text-slate-500">Or continue with</span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button onclick="loginWithGoogle()" class="flex items-center justify-center gap-2 w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium py-2 px-4 rounded-lg transition-colors">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/><path fill="none" d="M1 1h22v22H1z"/></svg>
                <span>Google</span>
            </button>
            <button onclick="loginWithDiscord()" class="flex items-center justify-center gap-2 w-full bg-[#5865F2] hover:bg-[#4752C4] text-white font-medium py-2 px-4 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.09 16.09 0 0 0-4.8 0c-.14-.33-.35-.76-.53-1.09A.09.09 0 0 0 9 4c-1.5.26-2.94.71-4.27 1.33-.01 0-.02.01-.03.02-2.72 4.07-3.47 8.03-3.1 11.95 0 .02.01.04.03.05 1.8 1.32 3.53 2.12 5.24 2.65.03.01.06-.01.07-.04.41-.56.8-1.16 1.15-1.77a.09.09 0 0 0-.04-.12 11.4 11.4 0 0 1-1.63-.78.09.09 0 0 1-.01-.15c.1-.08.21-.15.31-.23a.09.09 0 0 1 .1-.01c3.32 1.51 6.89 1.51 10.2 0a.09.09 0 0 1 .1.02c.1.08.2.15.3.23a.09.09 0 0 1-.02.15c-.5.3-1.04.56-1.61.78a.09.09 0 0 0-.04.12c.35.61.74 1.21 1.15 1.77.01.03.04.05.07.04 1.71-.53 3.44-1.33 5.24-2.65.02-.01.03-.03.03-.05.42-4.54-.73-8.48-3.14-11.95-.01-.01-.02-.02-.04-.02zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.83 2.12-1.89 2.12z"/></svg>
                <span>Discord</span>
            </button>
        </div>
    </div>

    <script>
        feather.replace();
        const SUPABASE_URL = "https://rjxislnrsgmxfyvqwgfh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_o6Na_xY_hTMB7Ald1lTw2w_d52XQw7S";
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { detectSessionInUrl: true, persistSession: true },
        });

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(";").shift();
        }

        async function loginWithDiscord() {
            await supabaseClient.auth.signInWithOAuth({
                provider: "discord",
                options: { redirectTo: window.location.origin + "/login/" },
            });
        }

        async function loginWithGoogle() {
            await supabaseClient.auth.signInWithOAuth({
                provider: "google",
                options: { redirectTo: window.location.origin + "/login/" },
            });
        }

        async function checkSession() {
            await new Promise((resolve) => setTimeout(resolve, 500));
            const { data, error } = await supabaseClient.auth.getSession();
            if (!data || !data.session) return;

            const session = data.session;
            const resp = await fetch("/auth/oauth/", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken"),
                },
                body: JSON.stringify({
                    access_token: session.access_token,
                    provider: session.user.app_metadata.provider,
                }),
            });

            const result = await resp.json();
            if (resp.ok) {
                window.history.replaceState({}, document.title, "/login/");
                if (result.role === "juristic") {
                    window.location.href = "/dashboard/";
                } else {
                    window.location.href = "/home/";
                }
            }
        }
        document.addEventListener("DOMContentLoaded", checkSession);
        
        // Add Tailwind classes to Django form inputs dynamically
        document.querySelectorAll('input[type="text"], input[type="password"]').forEach(el => {
            el.classList.add('w-full', 'px-3', 'py-2', 'border', 'border-slate-300', 'rounded-lg', 'focus:outline-none', 'focus:ring-2', 'focus:ring-indigo-500', 'focus:border-indigo-500');
        });
    </script>
</body>
</html>
