<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP - CommunitySync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="antialiased text-slate-800 flex items-center justify-center min-h-screen px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        <div class="text-center mb-8">
            <div class="mx-auto w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mb-4">
                <i data-feather="mail"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Check your email</h1>
            <p class="text-slate-500 mt-2 text-sm">We've sent a 4-digit code to your email address.</p>
        </div>

        {% if messages %}
        <div class="mb-4 space-y-2">
            {% for message in messages %}
            <div class="p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm flex items-center gap-2">
                <i data-feather="alert-circle" class="w-4 h-4"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div class="flex justify-center gap-3">
                <input type="text" name="code1" maxlength="1" required class="w-12 h-14 text-center text-2xl font-bold border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" onkeyup="if(this.value.length==1) document.getElementsByName('code2')[0].focus()">
                <input type="text" name="code2" maxlength="1" required class="w-12 h-14 text-center text-2xl font-bold border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" onkeyup="if(this.value.length==1) document.getElementsByName('code3')[0].focus()">
                <input type="text" name="code3" maxlength="1" required class="w-12 h-14 text-center text-2xl font-bold border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" onkeyup="if(this.value.length==1) document.getElementsByName('code4')[0].focus()">
                <input type="text" name="code4" maxlength="1" required class="w-12 h-14 text-center text-2xl font-bold border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors">
                Verify Code
            </button>
            
            <div class="text-center mt-4">
                <a href="{% url 'login' %}" class="text-sm font-medium text-slate-500 hover:text-slate-700">Back to Login</a>
            </div>
        </form>
    </div>
    
    <script>feather.replace();</script>
</body>
</html>
