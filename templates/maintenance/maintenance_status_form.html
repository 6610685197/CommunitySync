{% extends "base.html" %}

{% block content %}
<div style="max-width:700px;margin:30px auto;">
    <div style="background:#fff;border:1px solid #ddd;border-radius:10px;padding:24px;">
        <h1 style="margin-top:0;">Update Status</h1>

        <p><strong>Request:</strong> {{ req.title }}</p>

        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom:16px;">
                <label><strong>Status</strong></label><br>
                {{ form.status }}
            </div>

            <button type="submit" style="background:#2563eb;color:white;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;">
                Update
            </button>
            <a href="{% url 'maintenance_detail' req.pk %}" style="margin-left:10px;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
