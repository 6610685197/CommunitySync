{% extends "base.html" %}

{% block content %}
<div style="max-width:800px;margin:30px auto;">
    <div style="background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px;">
        <h1 style="margin-top:0;">{{ page_title }}</h1>

        <p><strong>Facility:</strong> {{ facility.name }}</p>

        <form method="POST">
            {% csrf_token %}

            <div style="margin-bottom:12px;">
                <label><strong>Unit Name</strong></label><br>
                {{ form.unit_name }}
            </div>

            <div style="margin-bottom:12px;">
                <label><strong>Status</strong></label><br>
                {{ form.status }}
            </div>

            <div style="margin-bottom:12px;">
                <label><strong>Note</strong></label><br>
                {{ form.note }}
            </div>

            <button type="submit" style="background:#2563eb;color:white;border:none;padding:10px 16px;border-radius:8px;">Save</button>
            <a href="{% url 'facility_detail' facility.pk %}" style="margin-left:8px;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
